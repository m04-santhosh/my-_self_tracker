app = "lifeos-90"
primary_region = "sin" # Singapore / closest free region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "lifeos_data"
  destination = "/app/database"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
